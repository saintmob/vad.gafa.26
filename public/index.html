<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 课程名册</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">AI</div>
          <div>
            <h1>课程名册</h1>
            <p id="repoName">saintmob/vad.gafa.26</p>
          </div>
        </div>

        <nav class="nav" aria-label="主导航">
          <button class="nav-item active" data-view="roster">师生名册</button>
          <button class="nav-item" data-view="review">数据修正</button>
          <button class="nav-item" data-view="issues">原始 Issues</button>
        </nav>

        <section class="sync-panel">
          <div class="sync-copy">
            <span>原始数据</span>
            <strong id="issueTotal">--</strong>
          </div>
          <button id="refreshBtn" class="primary-btn">刷新 Issues</button>
          <p id="syncStatus">等待同步</p>
        </section>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <h2 id="viewTitle">师生名册</h2>
            <p id="viewSubtitle">合并 GitHub issues 与本地人工修正外挂。</p>
          </div>
          <div class="searchbox">
            <span>搜索</span>
            <input id="searchInput" type="search" placeholder="姓名 / GitHub / 分类" />
          </div>
        </header>

        <section class="stats-grid" aria-label="统计">
          <div class="stat">
            <span>成员</span>
            <strong id="peopleCount">--</strong>
          </div>
          <div class="stat">
            <span>待校对</span>
            <strong id="reviewCount">--</strong>
          </div>
          <div class="stat">
            <span>人员修正</span>
            <strong id="personFixCount">--</strong>
          </div>
          <div class="stat">
            <span>Issue 修正</span>
            <strong id="issueFixCount">--</strong>
          </div>
        </section>

        <section id="rosterView" class="view active-view">
          <div id="peopleGrid" class="people-grid"></div>
        </section>

        <section id="reviewView" class="view">
          <div class="split-layout">
            <div>
              <div class="section-head">
                <h3>待手动校对</h3>
                <p>保存后写入本地外挂，不修改原始 issue。</p>
              </div>
              <div id="reviewList" class="review-list"></div>
            </div>

            <form id="editForm" class="editor-panel">
              <h3>修正选中项</h3>
              <input type="hidden" id="editIssue" />
              <label>
                Issue
                <input id="editIssueLabel" disabled />
              </label>
              <label>
                真实姓名
                <input id="editNames" placeholder="多人用顿号分隔" />
              </label>
              <label>
                分类
                <select id="editCategory"></select>
              </label>
              <label>
                角色
                <select id="editRole">
                  <option>学生/待校对</option>
                  <option>学生</option>
                  <option>老师</option>
                </select>
              </label>
              <label>
                备注
                <textarea id="editNote" rows="4" placeholder="记录校对依据"></textarea>
              </label>
              <label class="checkbox-row">
                <input id="editResolved" type="checkbox" />
                <span>已校对，隐藏在待处理列表</span>
              </label>
              <button class="primary-btn" type="submit">保存 Issue 修正</button>
            </form>
          </div>
        </section>

        <section id="issuesView" class="view">
          <div id="issueTable" class="issue-table"></div>
        </section>
      </main>
    </div>

    <dialog id="personDialog">
      <form id="personForm" method="dialog" class="person-form">
        <h3>修正成员信息</h3>
        <input type="hidden" id="personLogin" />
        <label>
          GitHub 名称
          <input id="personGithubName" />
        </label>
        <label>
          真实姓名
          <input id="personRealName" />
        </label>
        <label>
          角色
          <select id="personRole">
            <option>学生</option>
            <option>老师</option>
          </select>
        </label>
        <label>
          头像 URL
          <input id="personAvatarUrl" />
        </label>
        <label>
          备注
          <textarea id="personNote" rows="3"></textarea>
        </label>
        <div class="dialog-actions">
          <button type="button" id="cancelPerson">取消</button>
          <button class="primary-btn" value="default">保存成员修正</button>
        </div>
      </form>
    </dialog>

    <script src="/app.js" type="module"></script>
  </body>
</html>
